name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.22.2

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --noconfirm --name iOSPair --icon assets\icon.ico --paths .
          --exclude-module IPython --exclude-module jedi --exclude-module parso --exclude-module fastapi
          --exclude-module uvicorn --exclude-module starlette --exclude-module pydantic
          --exclude-module matplotlib --exclude-module numpy run.py

      - name: Test with simulated iPhone (source)
        run: python tests/test_e2e.py

      - name: Test with simulated iPhone (built exe)
        shell: pwsh
        run: |
          $env:FAKE_IPHONE_LIFETIME = "60"
          $fake = Start-Process python -ArgumentList "tests\fake_iphone.py", "16.7.10" -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          $p = Start-Process dist\iOSPair.exe -ArgumentList "--selftest", "selftest-out" -Wait -PassThru
          Stop-Process -Id $fake.Id -ErrorAction SilentlyContinue
          $files = Get-ChildItem selftest-out -Recurse -File
          $files | ForEach-Object { $_.Name }
          if ($p.ExitCode -ne 0 -or $files.Count -ne 4) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path iospair\__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item dist\iOSPair.exe dist\iOSPair-Portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: iOSPair-Windows
          path: |
            dist/iOSPair-Setup.exe
            dist/iOSPair-Portable.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iOSPair-Setup.exe
            dist/iOSPair-Portable.exe
